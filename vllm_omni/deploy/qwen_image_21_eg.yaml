# Qwen-Image 2.1 Encode/Generation disaggregated pipeline.
# E: Qwen3-VL encoder plus optional VAE condition encoding on GPU 0.
# G-D: DiT denoise and VAE decode on GPU 1.

pipeline: qwen_image_21_eg
async_chunk: false

trust_remote_code: true
distributed_executor_backend: "mp"

connectors:
  qwen_image_21_encode_connector:
    name: SharedMemoryConnector

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    tensor_parallel_size: 1
    output_connectors:
      to_stage_1: qwen_image_21_encode_connector
    default_sampling_params:
      seed: 42

  - stage_id: 1
    devices: "1"
    max_num_seqs: 1
    enforce_eager: true
    tensor_parallel_size: 1
    vae_use_tiling: true
    input_connectors:
      from_stage_0: qwen_image_21_encode_connector
    default_sampling_params:
      seed: 42
